[project]
name = "spine-segmentation"
version = "0.3.2"
description = "Anatomical labeling of the spine in small field-of-view MRI scans"
authors = [{ name = "Brutenis Gliwa", email = "brutenis@gmail.com" }]
requires-python = ">=3.10,<3.13.0"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.23.0,<2",
    "onnxruntime==1.17.1",
    "onnxruntime-gpu==1.17.1",
    "tqdm>=4.66.2,<5",
    "requests>=2.28.0,<3",
    "xxhash>=3.4.1,<4",
    "connected-components-3d>=3.12.1,<4",
    "pandas<2.0",
    "scikit-learn>=1.2.2,<2",
    "seaborn>=0.13.0,<0.14",
    "nibabel>=5.1.0,<6",
    "pydicom>=2.4.3,<4",
    "loguru>=0.7.2,<0.8",
]

[dependency-groups]
training = [
    "vispy>=0.13.0,<0.14",
    "matplotlib>=3.7.1,<4",
    "mlflow>=2.4.0,<4",
    "tabulate>=0.9.0,<0.10",
    "pyside6>=6.5.0,<7",
    "datasets>=2.12.0,<3",
    "segmentation-models-pytorch>=0.3.3,<0.4",
    "websockets>=11.0.3,<12",
    "fastapi>=0.80",
    "jsonargparse[signatures]>=4.23.1,<5",
    "kornia>=0.6.12,<0.7",
    "monai>=1.5.0,<2",
    "openmim>=0.3.9,<0.4",
    "netron>=7.1.5,<8",
    "xgboost>=1.7.6,<2",
    "pyqt6>=6.5.2,<7",
    "efficientnet-pytorch-3d",
]

[tool.uv.sources]
efficientnet-pytorch-3d = { git = "https://github.com/shijianjian/EfficientNet-PyTorch-3D" }

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-rA -s -v --junit-xml=junit.xml"
